name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: connectedops_test
          POSTGRES_USER: connectedops
          POSTGRES_PASSWORD: connectedops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U connectedops -d connectedops_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ConnectedOps.slnx

      - name: Build
        run: dotnet build ConnectedOps.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ConnectedOps.slnx --configuration Release --no-build
        env:
          RUNBOOK_PGVECTOR_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=connectedops_test;Username=connectedops;Password=connectedops_test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
