name: connected-operations-copilot

services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: connectedops
      POSTGRES_USER: connectedops
      POSTGRES_PASSWORD: connectedops_dev
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectedops -d connectedops"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - connectedops-pgdata:/var/lib/postgresql/data

volumes:
  connectedops-pgdata:
